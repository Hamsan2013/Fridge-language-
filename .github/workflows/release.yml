name: Build, Package & Upload FRIDGE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build fridge.exe and VS Code Extension
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Node.js for VS Code Extension
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist

      - name: Compile fridge.exe
        run: |
          cmake --build build --config Release --target install

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/fridge_installer.iss

      - name: Package VS Code Extension (.vsix)
        shell: pwsh
        run: |
          cd vscode-extension
          npm install
          npm install -g @vscode/vsce
          npx @vscode/vsce package --allow-missing-repository --out ../dist/fridge-language-0.4.0.vsix
          cd ..

      - name: Create Clean Distribution Folder
        shell: pwsh
        run: |
          # 1. Create the bundle directory first
          New-Item -ItemType Directory -Force -Path bundle

          # 2. Copy the standalone CLI compiler/interpreter
          if (Test-Path "dist\bin\fridge.exe") {
            Copy-Item -Path "dist\bin\fridge.exe" -Destination "bundle\"
          }

          # 3. Copy the Windows Inno Setup installer wizard
          if (Test-Path "dist\FRIDGE-Setup-v0.4.0.exe") {
            Copy-Item -Path "dist\FRIDGE-Setup-v0.4.0.exe" -Destination "bundle\"
          }

          # 4. Copy the VS Code plugin (.vsix)
          if (Test-Path "dist\fridge-language-0.4.0.vsix") {
            Copy-Item -Path "dist\fridge-language-0.4.0.vsix" -Destination "bundle\"
          }

          # 5. Copy icons and batch scripts
          if (Test-Path "resources\fridge.ico") {
            Copy-Item -Path "resources\fridge.ico" -Destination "bundle\"
          }
          if (Test-Path "packaging\windows\register_frg_icon.bat") {
            Copy-Item -Path "packaging\windows\register_frg_icon.bat" -Destination "bundle\"
          }
          if (Test-Path "tests\golden") {
            Copy-Item -Recurse -Path "tests\golden" -Destination "bundle\examples"
          }

      - name: Upload Artifacts (Downloadable ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: FRIDGE-Windows-Installer-and-Plugin
          path: bundle/
          if-no-files-found: error
          retention-days: 30
