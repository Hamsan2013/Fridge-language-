name: Build and Release FRIDGE

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSVC Toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist

      - name: Build fridge.exe
        run: cmake --build build --config Release --target install

      - name: Test Built Executable
        run: |
          .\dist\bin\fridge.exe version
          .\dist\bin\fridge.exe check tests\golden\01_hello.frg
          .\dist\bin\fridge.exe run tests\golden\01_hello.frg

      - name: Setup Node.js for VS Code Extension
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package VS Code Extension (.vsix)
        working-directory: vscode-extension
        run: |
          npm install -g @vscode/vsce
          vsce package --allow-missing-repository --out ../dist/fridge-vscode.vsix

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist\bin\fridge.exe, dist\resources, tests -DestinationPath dist\FRIDGE-Windows-x64.zip

      # Uploads directly to the GitHub Actions run Summary page
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FRIDGE-Windows-x64-Build
          path: |
            dist/FRIDGE-Windows-x64.zip
            dist/fridge-vscode.vsix
          retention-days: 30

      # Creates an official GitHub Release if triggered with a version tag
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FRIDGE-Windows-x64.zip
            dist/fridge-vscode.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
