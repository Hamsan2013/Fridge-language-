name: FRIDGE Build, Test and Release
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 build, tests and installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read FRIDGE engine version
        id: version
        shell: pwsh
        run: |
          $text = Get-Content "CMakeLists.txt" -Raw
          $match = [regex]::Match($text, 'project\(FRIDGE VERSION ([0-9]+\.[0-9]+\.[0-9]+)')
          if (-not $match.Success) { throw "Cannot read FRIDGE engine version from CMakeLists.txt" }
          $ver = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq "tag" -and $env:GITHUB_REF_NAME -ne "v$ver") { throw "Release tag does not match CMake version." }
          "VERSION=$ver" >> $env:GITHUB_OUTPUT
      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Build VS Code extension (keeps its own version)
        shell: pwsh
        run: |
          $pkg = Get-Content "vscode-extension/package.json" -Raw | ConvertFrom-Json
          $vsixVersion = $pkg.version
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          if (Test-Path "LICENSE.md") { Copy-Item "LICENSE.md" "vscode-extension/LICENSE.md" -Force }
          Push-Location "vscode-extension"
          try {
            npm install
            npm run vscode:prepublish
            npx @vscode/vsce package --out "..\dist\fridge-lang-$vsixVersion.vsix"
          } finally { Pop-Location }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\bin" | Out-Null
          $exe = Get-ChildItem -Path "build" -Recurse -Filter "fridge.exe" | Where-Object { $_.FullName -notmatch "fridge_test" } | Select-Object -First 1
          if (-not $exe) { throw "Release fridge.exe not found." }
          Copy-Item $exe.FullName "dist\bin\fridge.exe" -Force
          iscc "packaging\windows\fridge_installer.iss"
          if (-not (Test-Path "dist\FRIDGE-Setup-v${{ steps.version.outputs.VERSION }}.exe")) { throw "Windows installer output is missing." }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/FRIDGE-Setup-v${{ steps.version.outputs.VERSION }}.exe
            dist/fridge-lang-*.vsix
          if-no-files-found: error

  linux:
    name: Linux x86_64 build, tests and DEB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read FRIDGE engine version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^project\(FRIDGE VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$VERSION" || { echo "Cannot read engine version"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo "Release tag does not match CMake version"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --config Release --parallel
          ctest --test-dir build --output-on-failure
      - name: Build DEB package
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          mkdir -p pkg/DEBIAN pkg/usr/local/bin
          install -m 755 build/fridge pkg/usr/local/bin/fridge
          ARCH="$(dpkg --print-architecture)"
          printf 'Package: fridge-lang\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: %s\nMaintainer: Hamsan A\nDescription: FRIDGE Programming Language interpreter\n' "$VER" "$ARCH" > pkg/DEBIAN/control
          dpkg-deb --build pkg "FRIDGE-Linux-v$VER.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: FRIDGE-Linux-v${{ steps.version.outputs.VERSION }}.deb
          if-no-files-found: error

  macos:
    name: macOS universal build, tests and PKG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read FRIDGE engine version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^project\(FRIDGE VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$VERSION" || { echo "Cannot read engine version"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo "Release tag does not match CMake version"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Configure, build and test universal binary
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          cmake --build build --config Release --parallel
          ctest --test-dir build -C Release --output-on-failure
      - name: Build PKG installer
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          mkdir -p pkg-root/usr/local/bin
          install -m 755 build/fridge pkg-root/usr/local/bin/fridge
          pkgbuild --root pkg-root --identifier com.addevelopers.fridge --version "$VER" --install-location / "FRIDGE-macOS-v$VER.pkg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: FRIDGE-macOS-v${{ steps.version.outputs.VERSION }}.pkg
          if-no-files-found: error

  android:
    name: Android arm64 Termux build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read FRIDGE engine version
        id: version
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^project\(FRIDGE VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)"
          test -n "$VERSION" || { echo "Cannot read engine version"; exit 1; }
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then echo "Release tag does not match CMake version"; exit 1; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"
      - name: Cross-compile Android arm64 CLI
        run: |
          NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-android --config Release --parallel
          install -m 755 build-android/fridge "FRIDGE-Android-arm64-v${{ steps.version.outputs.VERSION }}"
          file "FRIDGE-Android-arm64-v${{ steps.version.outputs.VERSION }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: FRIDGE-Android-arm64-v${{ steps.version.outputs.VERSION }}
          if-no-files-found: error

  publish:
    name: Publish tagged release
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: FRIDGE ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
