name: Build, Test & Release FRIDGE v0.4.0

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  matrix-build-test:
    name: Build & Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Compile Toolchain & Tests
        run: cmake --build build --config Release

      - name: Run Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

  package-release:
    name: Package Official Release Artifacts
    needs: matrix-build-test
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build Windows Executable
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=dist
          cmake --build build --config Release --target install

      - name: Setup Node.js & Package VS Code VSIX
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          cd vscode-extension
          npm install
          npm run vscode:prepublish
          npx @vscode/vsce package --out ../dist/fridge-language-0.4.0.vsix

      - name: Create Release Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/bin/fridge.exe, dist/resources, README.md -DestinationPath dist/FRIDGE-v0.4.0-Windows-x64.zip

      - name: Publish Official Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FRIDGE-v0.4.0-Windows-x64.zip
            dist/fridge-language-0.4.0.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
