name: Build, Package & Upload FRIDGE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer & VS Code Extension
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract Version from package.json
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content "vscode-extension/package.json" | ConvertFrom-Json
          $version = $pkg.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Detected FRIDGE version: v$version"

      - name: Configure & Build fridge.exe (v${{ steps.ver.outputs.VERSION }})
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Ensure LICENSE.md is inside vscode-extension
        shell: pwsh
        run: |
          if (Test-Path "LICENSE.md") {
            Copy-Item "LICENSE.md" "vscode-extension/LICENSE.md" -Force
          }

      - name: Build VS Code Extension (.vsix)
        working-directory: vscode-extension
        run: |
          npm install
          npm run vscode:prepublish
          npx @vscode/vsce package --out "fridge-language-${{ steps.ver.outputs.VERSION }}.vsix"

      - name: Build Windows Setup Installer (FRIDGE-Setup-v${{ steps.ver.outputs.VERSION }}.exe)
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path "dist\bin" | Out-Null

          $exePath = Get-ChildItem -Path build -Recurse -Filter "fridge.exe" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $exePath) { throw "fridge.exe was not found in build output!" }
          Copy-Item $exePath "dist\bin\fridge.exe" -Force
          Copy-Item "vscode-extension\fridge-language-$ver.vsix" "dist\fridge-language-$ver.vsix" -Force

          iscc "packaging\windows\fridge_installer.iss"
          if (-not (Test-Path "dist\FRIDGE-Setup-v$ver.exe")) {
            throw "Inno Setup failed to produce dist\FRIDGE-Setup-v$ver.exe!"
          }
      - name: Upload Windows Installer & VS Code Plugin
        uses: actions/upload-artifact@v4
        with:
          name: FRIDGE-Windows-Installer-and-Plugin-v${{ steps.ver.outputs.VERSION }}
          path: |
            dist/FRIDGE-Setup-v${{ steps.ver.outputs.VERSION }}.exe
            dist/fridge-language-${{ steps.ver.outputs.VERSION }}.vsix
          if-no-files-found: error

  build-linux:
    name: Build FRIDGE Binary & .deb Installer for Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: ver
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build fridge & .deb Installer
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
           mkdir -p pkg-deb/DEBIAN pkg-deb/usr/local/bin
          find build -name "fridge" -type f -executable -exec cp {} pkg-deb/usr/local/bin/fridge \;
          chmod 755 pkg-deb/usr/local/bin/fridge
          printf "Package: fridge-lang\nVersion: %s\nSection: devel\nPriority: optional\nArchitecture: amd64\nMaintainer: Hamsan (AD Developers)\nDescription: Official FRIDGE Programming Language Interpreter\n" "$VER" > pkg-deb/DEBIAN/control
          dpkg-deb --build pkg-deb "FRIDGE-Linux-v${VER}.deb"

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: FRIDGE-Linux-Installer-v${{ steps.ver.outputs.VERSION }}
          path: FRIDGE-Linux-v${{ steps.ver.outputs.VERSION }}.deb

  build-macos:
    name: Build FRIDGE Binary & .pkg Installer for macOS
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Version
        id: ver
        run: |
          VERSION=$(node -p "require('./vscode-extension/package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build fridge & .pkg Installer
        run: |
          VER="${{ steps.ver.outputs.VERSION }}"
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          mkdir -p pkg-mac/usr/local/bin
          find build -name "fridge" -type f -perm +111 -exec cp {} pkg-mac/usr/local/bin/fridge \;
          chmod 755 pkg-mac/usr/local/bin/fridge
          pkgbuild --root pkg-mac --identifier com.addevelopers.fridge --version "$VER" --install-location / "FRIDGE-macOS-v${VER}.pkg"

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: FRIDGE-macOS-Installer-v${{ steps.ver.outputs.VERSION }}
          path: FRIDGE-macOS-v${{ steps.ver.outputs.VERSION }}.pkg
